<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DashboardAI</title>

  <!-- GridStack -->
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@7/dist/gridstack.min.css" />
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@7/dist/gridstack-extra.min.css" />

  <!-- Leaflet -->
  <link  rel="stylesheet" hrefDF="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- App styles -->
  <link  rel="stylesheet" href="https://beta.whsmonitor.com.au/dashboardv2/css/dashboard.css?ver=11111" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Chat sidebar collapse overrides (remote engine uses .hidden; we restyle it as a 36px strip) -->
  <style>
    .chat-sidebar.hidden {
      display: flex !important; /* override .hidden { display: none !important } from remote CSS */
      width: 36px !important;
      min-width: 36px !important;
      border-left: 1px solid var(--color-border) !important;
      overflow: hidden;
    }
    .chat-sidebar.hidden .chat-header,
    .chat-sidebar.hidden .chat-messages,
    .chat-sidebar.hidden .chat-input-area {
      opacity: 0;
      pointer-events: none;
    }
    .chat-sidebar.hidden .chat-expand-btn {
      display: flex !important;
    }
  </style>
</head>
<body class="dashboard-page">

  <!-- ── Top Bar ─────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <a href="/" class="topbar-logo">
	
	 <span class="d-none topbar-title" style="display: none !important" id="dashboardTitle">Loading…</span>
	<img src="https://whsmonitor.com.au/wp-content/themes/whs-monitor/assets/images/WHSLogo_Blue.png" />
    </a>
    <div class="topbar-actions">
      <button onclick="generatePDF()" class="btn-icon" title="Generate Report" style="margin-right:4px"><i class="ph ph-file-text"></i></button>
      <button onclick="generatePDF(true)" class="btn-icon" title="Generate AI Report (with insights)" style="margin-right:4px"><i class="ph ph-sparkle"></i></button>
      <button id="toggleChatBtn" class="btn-icon" title="Toggle chat"><i class="ph ph-chat-circle-dots"></i></button>
    </div>
  </header>

  <!-- ── Main Layout ────────────────────────────────────────────────────── -->
  <div class="main-layout">

    <!-- Filter Sidebar -->
    <aside class="filter-sidebar collapsed" id="filterSidebar">
      <div class="filter-sidebar-header">
        <span class="filter-sidebar-title">Filters</span>
        <div class="filter-sidebar-actions">
          <a href="#" class="filter-clear-all" id="filterClearAll">Clear All</a>
          <button class="filter-toggle-btn" id="filterToggleBtn" title="Collapse filters"><i class="ph ph-caret-left"></i></button>
        </div>
      </div>
      <div id="filterBar" class="filter-bar"></div>
      <button class="filter-expand-btn" id="filterExpandBtn" title="Expand filters"><i class="ph ph-caret-right"></i></button>
    </aside>

    <!-- Dashboard canvas -->
    <main class="canvas-area" id="canvasArea">
      <div class="grid-stack" id="gridContainer"></div>
    </main>

    <!-- Chat sidebar -->
    <aside class="chat-sidebar" id="chatSidebar">
      <button class="chat-expand-btn" id="chatExpandBtn" title="Expand chat"><i class="ph ph-caret-left"></i></button>
      <div class="chat-header">
        <span>AI Assistant</span>
        <button class="chat-toggle-btn btn-icon" id="closeChatBtn" title="Collapse"><i class="ph ph-caret-right"></i></button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-bubble assistant">
          Hi! I can modify this dashboard for you. Try:
          <ul>
            <li>"Add a hazard report for sales by location"</li>
            <li>"Show hazard report for last quarter"</li>
            <li>"Remove the table widget"</li>
            <li>"Add a date range filter"</li>
          </ul>
        </div>
      </div>
      <form class="chat-input-area" id="chatForm">
        <textarea id="chatInput" placeholder="Ask me to change the dashboard…" rows="2"></textarea>
        <button type="submit" id="chatSendBtn">Send</button>
      </form>
    </aside>
  </div>

  <!-- ── Scripts ─────────────────────────────────────────────────────────── -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@7/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/kpi-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/chart-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/table-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/map-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/markdown-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/gauge-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/stat-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/progress-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/donut-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/widgets/heatmap-widget.js"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/dashboard-engine.js?ver=1"></script>
  <script src="https://beta.whsmonitor.com.au/dashboardv2/js/chat.js?ver=1"></script>

  <!-- jsPDF + AutoTable + html2canvas for visual PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // Bootstrap: extract dashboard ID from URL path /dashboard/{id}
    const pathParts    = window.location.pathname.split('/');
    const dashboardId  = pathParts[pathParts.length - 1];

    // Read session from URL query string (set by the generate redirect)
    const _qs      = new URLSearchParams(window.location.search);
    const SESSION  = {
      userId:  _qs.get('userId')  || 'user_001',
      storeId: parseInt(_qs.get('storeId') || '1', 10)
    };

    DashboardEngine.init(dashboardId, SESSION);
    ChatManager.init(SESSION);

    async function generatePDF(aiMode = false) {
      const btn = document.querySelector('[onclick="generatePDF()"]');
      if (btn) btn.disabled = true;

      // ── Progress overlay ────────────────────────────────────────────────────
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Arial,sans-serif;backdrop-filter:blur(3px)';
      overlay.innerHTML = `<div style="background:#3B98F1;border-radius:12px;padding:30px 44px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);min-width:280px">
        <div style="color:#fff;font-size:15px;font-weight:700;letter-spacing:.03em;margin-bottom:6px">Preparing Report</div>
        <div id="__pdf_prog" style="color:rgba(255,255,255,.72);font-size:11px;margin-bottom:16px">Preparing…</div>
        <div style="height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden">
          <div id="__pdf_bar" style="height:100%;width:0%;background:#60a5fa;border-radius:3px;transition:width .35s ease"></div>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      const setProg = (msg, pct) => {
        const m = document.getElementById('__pdf_prog'); if (m) m.textContent = msg;
        const b = document.getElementById('__pdf_bar');  if (b) b.style.width = pct + '%';
      };

      try {
        if (!window.html2canvas) throw new Error('html2canvas not loaded — please refresh.');

        const dashboard  = DashboardEngine.getDashboard();
        const rawTitle   = (dashboard?.title || '').replace(/^Store\s+\d+\s*[-–—]?\s*/i, '').trim();
        const printTitle = rawTitle || 'Dashboard Report';
        const printDate  = new Date().toLocaleDateString('en-AU', { day: '2-digit', month: 'long', year: 'numeric' });
        const storeLabel = (typeof SESSION !== 'undefined' && SESSION.storeId) ? `Store ID ${SESSION.storeId}` : '';

        // HTML-escape helper — prevents XSS when injecting dynamic content into HTML
        const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        // ── Collect non-table widgets ──────────────────────────────────────────
        setProg('Collecting widgets…', 5);
        const gridItems = [...document.querySelectorAll('#gridContainer .grid-stack-item')]
          .map(el => ({
            content: el.querySelector('.grid-stack-item-content'),
            type:    el.dataset.type || '',
            title:   el.querySelector('.widget-header h3, .widget-title')?.textContent?.trim() || '',
            gsW: parseInt(el.getAttribute('gs-w') || '6', 10),
            gsH: parseInt(el.getAttribute('gs-h') || '2', 10),
            gsX: parseInt(el.getAttribute('gs-x') || '0', 10),
            gsY: parseInt(el.getAttribute('gs-y') || '0', 10),
          }))
          .filter(i => i.content && i.type !== 'table')
          .sort((a, b) => a.gsY !== b.gsY ? a.gsY - b.gsY : a.gsX - b.gsX);

        // ── Fetch table data ───────────────────────────────────────────────────
        setProg('Fetching table data…', 10);
        let allData = null;
        if (DashboardEngine.getAllWidgetDataForPrint) {
          allData = await DashboardEngine.getAllWidgetDataForPrint();
        }
        const tableWidgets = allData ? allData.filter(d => d.type === 'table') : [];

        // ── AI descriptions (aiMode only) ─────────────────────────────────────
        let descriptions = {};
        if (aiMode) {
          try {
            setProg('Generating AI insights…', 12);
            const allForDesc = [
              ...gridItems.map(i => {
                const valEl = i.content.querySelector('.kpi-value,.stat-value,.metric-value,[class*="kpi-val"],[class*="stat-val"],.big-number');
                return { title: i.title, type: i.type, chartType: i.content.dataset?.chartType || '', currentValue: valEl?.textContent?.trim() || '' };
              }),
              ...tableWidgets.map(({ widget }) => ({ title: widget.title || 'Table Data', type: 'table', chartType: '', currentValue: '' }))
            ];
            const res = await fetch('https://beta.whsmonitor.com.au/dashboardv2/api/chat/describe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dashboardTitle: printTitle, userId: SESSION.userId, storeId: SESSION.storeId, widgets: allForDesc })
            });
            if (res.ok) { const d = await res.json(); descriptions = d.descriptions || {}; }
          } catch (e) { console.warn('[AI Report] Description fetch failed:', e); }
        }
        // Case-insensitive lookup — API now returns {description, layout} objects per widget
        const getInsight = title => {
          if (!title) return { description: '', layout: 'full' };
          let raw = descriptions[title];
          if (!raw) {
            const lower = title.toLowerCase();
            const k = Object.keys(descriptions).find(k => k.toLowerCase() === lower);
            raw = k ? descriptions[k] : null;
          }
          if (!raw) return { description: '', layout: 'full' };
          // Backward-compat: handle plain strings from older API responses
          if (typeof raw === 'string') return { description: raw, layout: 'full' };
          return { description: raw.description || '', layout: raw.layout || 'full' };
        };

        // ── Separate KPI/stat from chart widgets ───────────────────────────────
        const COLORS     = ['', 'teal', 'indigo', 'amber'];
        const kpiItems   = gridItems.filter(i => i.type === 'kpi' || i.type === 'stat');
        const chartItems = gridItems.filter(i => i.type !== 'kpi' && i.type !== 'stat');

        // KPI mini strip — first ≤4 KPI/stat widgets
        let kpiStripHtml = '';
        kpiItems.slice(0, 4).forEach((item, idx) => {
          const body     = item.content;
          const valEl    = body.querySelector('.kpi-value,.stat-value,.metric-value,[class*="kpi-val"],[class*="stat-val"],.big-number');
          const lblEl    = body.querySelector('.kpi-label,.stat-label,.kpi-subtitle,[class*="kpi-lbl"],[class*="stat-lbl"]');
          const trendEl  = body.querySelector('.kpi-trend,.stat-trend,[class*="trend"]');
          const val      = esc(valEl?.textContent?.trim()   || '—');
          const lbl      = esc(lblEl?.textContent?.trim()   || item.title);
          const trendRaw = trendEl?.textContent?.trim() || '';
          const isDown   = /▼|down|decr|-\d/i.test(trendRaw);
          const trend    = esc(trendRaw);
          const cc       = COLORS[idx % COLORS.length];
          kpiStripHtml  += `<div class="kpi-card">
            <div class="metric-value">${val}</div>
            <div class="metric-label">${lbl}</div>
            ${trend ? `<div class="trend${isDown ? ' down' : ''}">${trend}</div>` : ''}
          </div>`;
        });

        // Chart cards (screenshots) + KPI overflow cards
        let cardsHtml = '';
        let cIdx = 0;
        let lastSideLayout = null; // track last "right"/"left" to force alternation
        for (let i = 0; i < chartItems.length; i++) {
          const item = chartItems[i];
          setProg(`Capturing widget ${i+1} of ${chartItems.length}…`, 20 + Math.round(((i+1) / Math.max(chartItems.length, 1)) * 55));
          // Prefer reading the Chart.js canvas directly — gives just the chart, no widget header
          const chartCanvas = item.content.querySelector('canvas');
          let img;
          if (chartCanvas) {
            img = chartCanvas.toDataURL('image/png');
          } else {
            const capturedCanvas = await html2canvas(item.content, {
              scale: 3, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', logging: false
            });
            img = capturedCanvas.toDataURL('image/png');
          }
          const cc       = COLORS[cIdx % COLORS.length];
          const spanFull = item.gsW >= 10 ? ' style="grid-column:1/-1"' : '';
          const insight  = aiMode ? getInsight(item.title) : null;
          // Layout is driven by widget width, not AI choice:
          //   full-width (gsW >= 10)  → bottom (insight below chart)
          //   partial-width           → alternate right / left
          //   no AI mode / no desc    → full (chart only)
          let layout;
          if (!aiMode || !insight?.description) {
            layout = 'full';
          } else if (item.gsW >= 10) {
            layout = 'bottom';
          } else {
            lastSideLayout = lastSideLayout === 'right' ? 'left' : 'right';
            layout = lastSideLayout;
          }
          if (layout === 'right') {
            cardsHtml += `<div class="wc wide">
              <div class="wc-head"><span class="wc-head-title">${esc(item.title) || 'Widget'}</span></div>
              <div class="wc-body-right">
                <div class="wc-img"><img src="${img}" style="width:100%;display:block" /></div>
                <div class="insight-panel"><p>${esc(insight.description)}</p></div>
              </div>
            </div>`;
          } else if (layout === 'left') {
            cardsHtml += `<div class="wc wide">
              <div class="wc-head"><span class="wc-head-title">${esc(item.title) || 'Widget'}</span></div>
              <div class="wc-body-left">
                <div class="insight-panel"><p>${esc(insight.description)}</p></div>
                <div class="wc-img"><img src="${img}" style="width:100%;display:block" /></div>
              </div>
            </div>`;
          } else if (layout === 'bottom' && insight?.description) {
            cardsHtml += `<div class="wc${item.gsW >= 10 ? ' wide' : ''}">
              <div class="wc-head"><span class="wc-head-title">${esc(item.title) || 'Widget'}</span></div>
              <div class="wc-body-bottom">
                <div class="wc-img"><img src="${img}" style="width:100%;display:block" /></div>
                <div class="wc-note"><span class="note-label">Insight</span>${esc(insight.description)}</div>
              </div>
            </div>`;
          } else {
            cardsHtml += `<div class="wc${item.gsW >= 10 ? ' wide' : ''}">
              <div class="wc-head"><span class="wc-head-title">${esc(item.title) || 'Widget'}</span></div>
              <div class="wc-body-bottom">
                <div class="wc-img"><img src="${img}" style="width:100%;display:block" /></div>
              </div>
            </div>`;
          }
          cIdx++;
        }
        kpiItems.slice(4).forEach(item => {
          const body     = item.content;
          const valEl    = body.querySelector('.kpi-value,.stat-value,.metric-value,[class*="kpi-val"],[class*="stat-val"],.big-number');
          const lblEl    = body.querySelector('.kpi-label,.stat-label,.kpi-subtitle,[class*="kpi-lbl"],[class*="stat-lbl"]');
          const trendEl  = body.querySelector('.kpi-trend,.stat-trend,[class*="trend"]');
          const val      = esc(valEl?.textContent?.trim()   || '—');
          const lbl      = esc(lblEl?.textContent?.trim()   || item.title);
          const trendRaw = trendEl?.textContent?.trim() || '';
          const isDown   = /▼|down|decr|-\d/i.test(trendRaw);
          const trend    = esc(trendRaw);
          const cc       = COLORS[cIdx % COLORS.length];
          cardsHtml += `<div class="wc">
            <div class="wc-head"><span class="wc-head-title">${esc(item.title) || 'KPI'}</span></div>
            <div class="wc-body-bottom" style="padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div class="metric-value">${val}</div>
              ${lbl ? `<div class="metric-label">${lbl}</div>` : ''}
              ${trend ? `<div class="trend${isDown ? ' down' : ''}">${trend}</div>` : ''}
            </div>
          </div>`;
          cIdx++;
        });

        // ── Table pages ────────────────────────────────────────────────────────
        const fmtCell = v => {
          if (v === null || v === undefined) return '-';
          const s = String(v).trim();
          if (/^\d{4}-\d{2}-\d{2}([ T]|$)/.test(s)) {
            const d = new Date(s);
            if (!isNaN(d.getTime()))
              return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
          }
          return esc(s);
        };
        const fmtHdr     = c => esc(c.replace(/([A-Z])/g, ' $1').replace(/_/g, ' ').trim());
        const badgeClass = v => {
          const s = String(v).toLowerCase();
          if (/\bopen\b|high|fail|\bdanger\b|critical|reject/.test(s)) return 'red';
          if (/clos|done|complet|pass|resolv|approv/.test(s))          return 'green';
          if (/review|pending|\bprogress\b|medium|warn/.test(s))       return 'amber';
          return '';
        };

        let tablePagesHtml = '';
        tableWidgets.forEach(({ widget, data, error }) => {
          let bodyHtml;
          if (error || !data || !data.length) {
            bodyHtml = `<div style="padding:20px 28px;color:#6b7280;font-size:11px">${error ? 'Error: '+esc(String(error)) : 'No data available'}</div>`;
          } else {
            const cfg  = widget.config || {};
            const cols = cfg.columns ? cfg.columns.split(',').map(c => c.trim()).filter(Boolean) : Object.keys(data[0]);
            const rows = data.map(row => `<tr>${cols.map(c => {
              const raw = fmtCell(row[c]);
              const bc  = badgeClass(raw);
              return `<td>${bc ? `<span class="badge ${bc}">${raw}</span>` : raw}</td>`;
            }).join('')}</tr>`).join('');
            bodyHtml = `<div class="data-table-wrap"><table class="data-table">
              <thead><tr>${cols.map(c => `<th>${fmtHdr(c)}</th>`).join('')}</tr></thead>
              <tbody>${rows}</tbody>
            </table></div>`;
          }
          const tableNote = aiMode && getInsight(widget.title || 'Table Data').description ? `<div class="table-insight">${esc(getInsight(widget.title || 'Table Data').description)}</div>` : '';
          tablePagesHtml += `<section class="page">
            <main class="content">
              <div class="table-card">
                <div class="table-banner"><span class="tit">${esc(widget.title || 'Table Data')}</span>${data && data.length ? `<span class="cnt">${data.length} records &middot; ${printDate}</span>` : ''}</div>
                ${tableNote}
                ${bodyHtml}
              </div>
            </main>
            <div class="page-footer"><span class="brand">WHS Monitor</span><span>${esc(printTitle)}</span></div>
          </section>`;
        });

        // ── Widget overview page ───────────────────────────────────────────────
        const widgetPageHtml = gridItems.length > 0 ? `<section class="page">
          <main class="content">
            <header class="section-header"><div><div class="section-kicker">Overview</div><h2 class="section-title">Key Metrics</h2></div><span class="section-date">${printDate}</span></header>
            ${kpiStripHtml ? `<div class="kpi-strip">${kpiStripHtml}</div>` : ''}
            <header class="section-header"><div><div class="section-kicker">Dashboard Widgets</div><h2 class="section-title">${esc(printTitle)}</h2></div></header>
            ${cardsHtml ? `<div class="cards-grid">${cardsHtml}</div>` : ''}
          </main>
          <div class="page-footer"><span class="brand">WHS Monitor</span><span>1</span></div>
        </section>` : '';

        // ── Logo ───────────────────────────────────────────────────────────────
        const logoSrc  = document.querySelector('.topbar-logo img')?.src || '';
        const logoHtml = logoSrc ? `<img src="${logoSrc}" crossorigin="anonymous" style="max-height:24px;width:auto" />` : '';

        // ── Assemble HTML document ─────────────────────────────────────────────
        setProg('Building report…', 90);
        const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>${esc(printTitle)} — Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#3B98F1;--secondary:#212950;--bg:#F8F7F5;--white:#FFFFFF;--text:#231F21;--muted:#6F7482;--line:#ECEEF2;--soft-blue:#EEF6FF;--success:#12A37F;--warning:#F59E0B;--danger:#E45E5E;--radius:10px;--shadow:0 10px 25px rgba(33,41,80,.06)}
body{min-height:100vh;background:var(--bg);font-family:'Nunito',Arial,sans-serif;color:var(--text);padding:32px 20px 56px;display:flex;flex-direction:column;align-items:center;gap:28px}
h1,h2,h3{font-family:'Poppins',Arial,sans-serif;font-weight:600;color:var(--secondary)}
p{line-height:1.65;color:var(--muted)}
.print-bar{width:min(960px,100%);background:var(--white);border:1px solid var(--line);box-shadow:0 6px 18px rgba(33,41,80,.05);border-radius:8px;padding:10px 12px 10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:16px;z-index:20}
.print-bar-title{font-size:13px;color:var(--secondary);font-weight:600;display:flex;gap:10px;align-items:center}
.ai-badge{background:var(--soft-blue);color:var(--primary);font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px}
.print-btn{border:0;background:var(--primary);color:white;border-radius:8px;padding:11px 18px;font-weight:600;font-family:'Nunito',Arial,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(59,152,241,.25)}
.page{width:min(960px,100%);min-height:1120px;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.cover{padding:54px 56px 44px;background:#fff}
.brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:90px}
.logo-mark{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--secondary)}
.cover-chip{border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--secondary);font-weight:600;font-size:12px;background:white}
.cover-eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--primary);font-weight:700;margin-bottom:14px}
.cover-title{font-size:56px;line-height:1.05;max-width:600px;letter-spacing:-.05em;margin-bottom:18px;font-family:'Poppins',Arial,sans-serif;font-weight:600;color:var(--secondary)}
.cover-sub{font-size:17px;max-width:520px;color:var(--muted)}
.cover-meta-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 56px 56px;background:white}
.cover-meta-item{background:var(--bg);border-radius:10px;padding:22px 24px;border:1px solid #F0EFED;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.cover-meta-val{font-family:'Poppins',Arial,sans-serif;font-size:34px;line-height:1;color:var(--secondary);font-weight:600;margin:auto 0}
.cover-meta-val.accent{color:var(--primary)}
.cover-meta-val.date{font-size:20px;letter-spacing:-.03em}
.cover-meta-lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:auto}
.content{padding:34px 40px 30px;display:flex;flex-direction:column;gap:24px;flex:1}
.section-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:4px 0 2px}
.section-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:4px}
.section-title{font-size:25px;letter-spacing:-.03em}
.section-date{font-size:13px;color:var(--muted);font-weight:600}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:20px;position:relative;overflow:hidden}
.metric-value{font-size:34px;letter-spacing:-.05em;margin-bottom:4px;font-family:'Poppins',Arial,sans-serif;font-weight:600;color:var(--secondary)}
.metric-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;min-height:32px}
.trend{margin-top:12px;font-size:12px;color:var(--success);font-weight:700}
.trend.down{color:var(--danger)}
.trend.warn{color:var(--warning)}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wc{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:330px}
.wc.wide{grid-column:1/-1;min-height:300px}
.wc-head{padding:22px 24px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wc-head-title{font-family:'Poppins',Arial,sans-serif;font-weight:600;color:var(--secondary);font-size:20px;line-height:1.2;letter-spacing:-.03em}
.wc-body-right,.wc-body-left{display:grid;grid-template-columns:1.55fr 1fr;gap:0;flex:1}
.wc-body-left{grid-template-columns:1fr 1.55fr}
.wc-body-left .wc-img{order:2}
.wc-body-left .insight-panel{order:1}
.wc-body-bottom{display:flex;flex-direction:column;flex:1}
.wc-img{background:#fff;padding:14px 18px 20px;display:flex;align-items:center;justify-content:center}
.wc-img img{width:100%;display:block}
.insight-panel{background:#fff;padding:28px 26px;display:flex;align-items:center}
.insight-panel p{font-size:14px;color:#545A6B}
.wc-note{border-top:1px solid var(--line);background:var(--bg);padding:18px 22px;color:#545A6B;font-size:13px;line-height:1.6}
.note-label{display:block;color:var(--primary);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:700;margin-bottom:6px}
.table-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white}
.table-banner{padding:24px 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:white}
.table-banner .tit{font-family:'Poppins',Arial,sans-serif;font-size:23px;color:var(--secondary);font-weight:600;letter-spacing:-.03em}
.cnt{background:var(--soft-blue);color:var(--primary);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700}
.table-insight{margin:20px 24px;background:var(--bg);border-radius:8px;padding:18px 20px;color:#545A6B;font-size:14px;line-height:1.65;border-left:4px solid var(--primary)}
.data-table-wrap{padding:0 24px 26px;overflow-x:auto}
.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.data-table th{padding:13px 14px;text-align:left;background:var(--secondary);color:white;font-weight:700}
.data-table th:first-child{border-radius:4px 0 0 4px}
.data-table th:last-child{border-radius:0 4px 4px 0}
.data-table td{padding:14px;border-bottom:1px solid var(--line);color:#3D4250}
.badge{display:inline-block;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700}
.badge.red{background:#FFF0F0;color:var(--danger)}
.badge.green{background:#EAF8F4;color:var(--success)}
.badge.amber{background:#FFF7E8;color:var(--warning)}
.page-footer{margin-top:auto;padding:18px 40px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}
.brand{color:var(--secondary)}
@media print{
  body{background:white;padding:0;gap:0}
  .print-bar{display:none}
  .page{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none;page-break-after:always}
  .page:last-child{page-break-after:auto}
  .cover{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .data-table th{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .wc{page-break-inside:avoid;break-inside:avoid}
  .kpi-strip{page-break-inside:avoid;break-inside:avoid}
  .data-table tbody tr{page-break-inside:avoid;break-inside:avoid}
  .table-insight{page-break-inside:avoid;break-inside:avoid}
  .insight-panel{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
